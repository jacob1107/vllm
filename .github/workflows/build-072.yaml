name: build

on:
  push:
    branches:
      - "v0.8.4"

env:
  DOCKERHUB_USERNAME: jacob1107

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set outputs
        id: vars
        run: echo "::set-output name=sha_short::$(git rev-parse --short HEAD)"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
     #- name: Clean Docker
     #   run: docker system prune --all --force --volumes
      - name: Build Docker Image
        #run:  DOCKER_BUILDKIT=1 docker build  -t ${{ env.DOCKERHUB_USERNAME }}/backend-vllm:${{ steps.vars.outputs.sha_short }}  .  --target   vllm-openai   
        run:  DOCKER_BUILDKIT=1 docker build . --target vllm-openai --tag ${{ env.DOCKERHUB_USERNAME }}/backend-vllm:gpu-v0.8.4-amd64  --file docker/Dockerfile    --build-arg max_jobs=10  --build-arg nvcc_threads=2  --build-arg torch_cuda_arch_list="8.0" --build-arg vllm_fa_cmake_gpu_arches="80-real"  --build-arg  RUN_WHEEL_CHECK=false  --build-arg    TARGETPLATFORM=linux/amd64    --build-arg TARGETPLATFORM="linux/amd64" 
      - name: Build backend and push
